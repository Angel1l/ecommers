<mat-nav-list>
    <mat-list-item
    routerLink="/dashboard/home"
    (click)="handleItemClick()"
    routerLinkActive="activeLink">
        <span class="style-menu">
            <mat-icon>
                home
            </mat-icon>
            dashboard
        </span>
    </mat-list-item>

    <mat-list-item routerLink="/dashboard/productos"
      (click)="handleItemClick()"
    routerLinkActive="activeLink">
        <span class="style-menu">
            <mat-icon>
                table
            </mat-icon>
            Productos
        </span>
    </mat-list-item>

    <mat-list-item routerLink="/dashboard/categorias"
      (click)="handleItemClick()"
    routerLinkActive="activeLink">
        <span class="style-menu">
            <mat-icon>
                table
            </mat-icon>
            Categorias
        </span>
    </mat-list-item>
    <mat-nav-list>
            <mat-list-item (click)="toggleSubmenu('componet')"> 
                <span class="style-menu">
                    <mat-icon class="icon-margin">
                        https
                    </mat-icon>
                    Submenu
                    <div class="expand-submenu">
                        <mat-icon class=" expand-icon">
                           {{subMenuOpen()==="componet"?'expand_less':'expand_more'}}
                        </mat-icon>
                    </div>
                </span>
            </mat-list-item>
            @if (subMenuOpen()==="componet"){
                <div class="submenu-content">
                    <mat-list-item routerLink="/dashboard/submenu/submenu1"
                    (click)="handleItemClick()"
                    routerLinkActive="activeLink"
                    tabindex="-1">
                        <span class="style-menu">
                            <mat-icon>
                                list
                            </mat-icon>
                            Submenu1
                        </span>
                    </mat-list-item>

                    <mat-list-item routerLink="/dashboard/submenu/submenu2"
                    (click)="handleItemClick()"
                    routerLinkActive="activeLink"
                    tabindex="-1">
                        <span class="style-menu">
                            <mat-icon>
                                list
                            </mat-icon>
                            Submenu2
                        </span>
                    </mat-list-item>
                </div>
            }
    </mat-nav-list>

</mat-nav-list>
